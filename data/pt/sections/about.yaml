summary: |
  Abílio Júnior é mestre em Informática Aplicada pela Universidade de Fortaleza (UNIFOR). Sua pesquisa inclui desenvolvimento de software, modelos, definição de arquiteturas e implementação de sistemas para monitoramento e gerenciamento de água utilizando Internet das Coisas. Faz parte do grupo de pesquisa Industrial Informatics, Electronics and Health.

  Atua como sócio proprietário na NOVA Tecnologia, desenvolvendo projetos de automação de recursos hídricos, industrial, predial e de infraestrutura urbana, além de projetos de inovação da empresa.

